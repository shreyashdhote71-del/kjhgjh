<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONERA | School & College Management</title>
<script>
/* set before the page paints, so a dark theme never flashes light */
document.documentElement.dataset.theme = JSON.parse(localStorage.settings || '{}').theme || 'light';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">

<style>
:root {
  color-scheme: light;
  --ink: #111a33;
  --mute: #667089;
  --line: #e9e8f2;
  --white: #ffffff;
  --blue: #2f6bff;
  --blue-dark: #1b4fd8;
  --blue-soft: #eef3ff;
  --vio: #7c3aed;
  --vio-soft: #f1e9fe;
  --org: #e8791f;
  --lilac: #ece3fc;
  --sky: #dcf0fd;
  --peach: #fde8da;
  --mint: #dcf6e4;
  --green: #12804d;
  --red: #cf2f2f;
  --display: 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
  --link: #1b4fd8;
  --vio-solid: #7c3aed;
  --label: #3c4560;
  --nav: #4b546e;
  --field: #fbfbfe;
  --bg: #f7f5fc;
  --soft: #f6f4fb;
  --hair: #f1eff6;
  --band: #e7eeff;
  --band2: #d9e5ff;
  --band-line: #c7d8ff;
  --lock-bg: #fff9ee;
  --lock-ink: #80591b;
  --rose: #fdecec;
  --rose-line: #f6c4c4;
  --mint-line: #9fdfb7;
  --sky-ink: #1877b8;
  --later: #a9aebd;
  --hero-ink: #16244a;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e8ebf6;
  --mute: #9aa3bd;
  --line: #2a3250;
  --white: #161c31;
  --blue-soft: #1e2a4d;
  --vio: #b79bff;
  --vio-soft: #2a2350;
  --lilac: #2e2550;
  --sky: #16344a;
  --peach: #42291a;
  --mint: #153a2a;
  --green: #4fd08f;
  --red: #ff8080;
  --link: #9db8ff;
  --label: #c3cae0;
  --nav: #b4bcd4;
  --field: #10162a;
  --bg: #0e1324;
  --soft: #1c2340;
  --hair: #232a45;
  --band: #1b2547;
  --band2: #1f2b52;
  --band-line: #2f3d6b;
  --lock-bg: #3a2e16;
  --lock-ink: #f0cd8a;
  --rose: #45202a;
  --rose-line: #7a3640;
  --mint-line: #2c6b4d;
  --sky-ink: #7cc4f5;
  --later: #5f6781;
  --hero-ink: #d5def5;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--white);
  color: var(--ink);
  font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
  line-height: 1.6;
}

/* faint logo watermark on every page: above the opaque cards so it stays visible, clicks pass through */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 1;
  background: url(/logo.png) center / min(70vw, 620px) no-repeat;
  opacity: .07;
  pointer-events: none;
}

a { color: inherit; text-decoration: none; }

button, input, select, textarea { font-family: inherit; font-size: 14px; }

button {
  background: var(--blue);
  border: 0;
  color: #fff;
  padding: 11px 20px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  transition: background .2s, transform .2s;
}

button:hover { background: var(--blue-dark); transform: translateY(-1px); }

button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, a:focus-visible, .col:focus-visible, .sc:focus-visible {
  outline: 3px solid #a9c3ff;
  outline-offset: 2px;
}

svg.i {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

/* FORMS */

form {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
}

form h3 { font-size: 18px; margin: 0 0 16px; }

label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
  color: var(--label);
}

input, select, textarea {
  display: block;
  width: 100%;
  padding: 11px 13px;
  margin-top: 6px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--field);
  color: var(--ink);
}

form button { width: 100%; }

.pw { position: relative; margin-bottom: 14px; }

.pw label { margin-bottom: 0; }

.pw input { padding-right: 46px; }

/* Edge draws its own eye on password fields */
.pw input::-ms-reveal { display: none; }

form .eye {
  position: absolute;
  right: 6px;
  bottom: 5px;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--mute);
}

form .eye:hover { background: transparent; color: var(--ink); transform: none; }

/* LANDING */

.wrap { max-width: 1180px; margin: auto; padding: 0 24px; }

.hero {
  margin: 16px;
  border-radius: 28px;
  overflow: hidden;
  background:
    linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px) 0 0 / 56px 56px,
    linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px) 0 0 / 56px 56px,
    radial-gradient(circle at 25% 15%, #dbe7ff 0, transparent 42%),
    linear-gradient(120deg, #a9c6ff, #4d86ff 62%, #2f6bff);
}

.topnav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px 0;
}

.brand img { display: block; height: 72px; padding: 6px 10px; border-radius: 14px; background: #fff; }

.pills {
  display: flex;
  gap: 4px;
  padding: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,.22);
  border: 1px solid rgba(255,255,255,.4);
}

.pills a {
  color: var(--ink);
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
}

.pills a:hover, .pills a.on { background: var(--blue); color: #fff; }

.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px 9px 20px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  background: rgba(255,255,255,.2);
  border: 1px solid rgba(255,255,255,.55);
}

.herogrid {
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  gap: 40px;
  align-items: center;
  padding: 40px 0 72px;
}

.tag {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: rgba(255,255,255,.4);
  border: 1px solid rgba(255,255,255,.6);
}

.hero h1, .head h2 {
  font-family: var(--display);
  font-weight: 400;
  letter-spacing: .5px;
  line-height: 1.08;
}

.hero h1 { font-size: clamp(42px, 5.6vw, 68px); margin: 18px 0 14px; }

.hero p { max-width: 520px; margin: 0 0 24px; font-weight: 500; color: var(--hero-ink); }

.find {
  display: flex;
  gap: 6px;
  max-width: 560px;
  padding: 6px;
  border-radius: 999px;
  background: rgba(255,255,255,.55);
  border: 1px solid rgba(255,255,255,.75);
}

.find input { margin: 0; border: 0; background: transparent; padding: 8px 16px; min-width: 0; }

.find input:focus-visible { outline: 0; }

.find select {
  flex: none;
  width: 140px;
  margin: 0;
  padding: 8px 10px;
  border: 0;
  border-left: 1px solid rgba(17,26,51,.18);
  border-radius: 0;
  background: transparent;
  font-weight: 600;
  cursor: pointer;
}

.find button { flex: none; }

.glass {
  padding: 22px;
  border-radius: 22px;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(255,255,255,.85);
  box-shadow: 0 24px 50px rgba(17,42,120,.22);
}

.glass h3 { margin: 0 0 14px; font-size: 16px; }

.nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }

.nums div { background: var(--white); border-radius: 14px; padding: 12px; }

.nums b { display: block; font-size: 22px; line-height: 1.2; }

.nums span { font-size: 12px; color: var(--mute); font-weight: 600; }

.mod {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  margin-top: 8px;
  background: var(--white);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
}

.mod svg { color: var(--blue); }

.mod small { margin-left: auto; color: var(--mute); font-weight: 600; }

.blues {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin: 56px 0 72px;
}

.blues div {
  padding: 28px;
  text-align: center;
  border-radius: 16px;
  color: var(--ink);
  background: radial-gradient(circle at center, var(--white) 0, var(--band2) 100%);
  border: 1px solid var(--band-line);
}

.blues svg { width: 26px; height: 26px; color: var(--blue); }

.blues h3 { margin: 8px 0 4px; font-size: 18px; }

.blues p { margin: 0; font-size: 13px; color: var(--mute); }

.head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 24px;
}

.head h2 { font-size: clamp(30px, 3.6vw, 40px); margin: 0; }

.found { margin: -12px 0 18px; font-size: 13px; font-weight: 600; color: var(--mute); }

.filter { display: flex; flex-wrap: wrap; gap: 8px; }

#view > .filter { margin-bottom: 14px; }

.filter button {
  background: var(--white);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 7px 18px;
  font-size: 13px;
}

.filter button.on, .filter button:hover { background: var(--blue); border-color: var(--blue); color: #fff; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
  margin-bottom: 72px;
}

.sc {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  cursor: pointer;
  transition: border-color .2s, transform .2s;
}

.sc:hover { border-color: var(--blue); transform: translateY(-3px); }

.sc .ic {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: var(--blue-soft);
  color: var(--blue);
  margin-bottom: 12px;
}

.sc h3 { margin: 0; font-size: 17px; }

.sc p { margin: 2px 0 12px; font-size: 13px; color: var(--mute); }

.joinband {
  background: linear-gradient(180deg, var(--white), var(--band));
  padding: 20px 0 80px;
}

.join {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: center;
}

.join p { color: var(--mute); }

.loginbox {
  width: min(420px, calc(100vw - 32px));
  padding: 0;
  border: 0;
  border-radius: 18px;
  background: var(--white);
  color: var(--ink);
  box-shadow: 0 24px 60px rgba(17,42,120,.35);
}

.loginbox::backdrop { background: rgba(17,26,51,.55); }

.loginbox form { border: 0; }

.loginbox .hint { margin: -10px 0 0; padding: 0 24px 20px; }

.loginbox .close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 20px;
  line-height: 1;
  background: var(--blue-soft);
  color: var(--ink);
}

.loginbox .close:hover { background: var(--band2); }

.loginlang {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 16px 64px 0 24px;
  color: var(--mute);
}

.loginlang .i { flex: none; width: 18px; height: 18px; }

.loginlang select { width: auto; max-width: 100%; padding: 6px 10px; font-size: 13px; }

.loginbox .sent { margin: 0; padding: 24px 56px 12px 24px; font-size: 14px; font-weight: 600; }

.loginlinks { display: flex; justify-content: space-between; gap: 12px; padding: 0 24px 20px; margin-top: -10px; }

.loginlinks button {
  padding: 2px 0;
  background: transparent;
  color: var(--link);
  border-radius: 6px;
  font-size: 13px;
}

.loginlinks button:hover { background: transparent; text-decoration: underline; transform: none; }

.loginbox form .hint { margin: -8px 0 14px; padding: 0; text-align: left; }

.schoolpick { padding: 24px 24px 20px; }

.schoolpick h3 { font-size: 18px; margin: 0 56px 16px 0; }

.schoolpick label { margin-bottom: 10px; }

.picklist { display: grid; gap: 8px; max-height: 280px; overflow-y: auto; }

.picklist .empty { margin: 0; }

.picklist button {
  display: block;
  width: 100%;
  padding: 10px 13px;
  text-align: left;
  background: var(--blue-soft);
  color: var(--ink);
  border-radius: 10px;
}

.picklist button:hover { background: var(--band2); transform: none; }

.picklist small { display: block; font-weight: 400; color: var(--mute); }

.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.roles div { padding: 16px; border-radius: 14px; background: var(--white); border: 1px solid var(--band-line); }

.roles b { display: block; font-size: 14px; }

.roles span { font-size: 12.5px; color: var(--mute); }

.hint { font-size: 12.5px; color: var(--mute); margin: 12px 0 0; text-align: center; }

/* DASHBOARD */

.shell {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: 100vh;
  background: var(--bg);
}

.side {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 22px 14px;
  background: var(--white);
  border-right: 1px solid var(--line);
}

.side .brand { display: block; padding: 0 12px 20px; }

.side .brand img { height: 112px; margin: 0 auto; }

.side nav { display: grid; gap: 4px; }

.side button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  background: transparent;
  color: var(--nav);
  border-radius: 10px;
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}

.side button:hover { background: var(--vio-soft); color: var(--vio); transform: none; }

.side button.on { background: var(--vio-soft); color: var(--vio); font-weight: 800; }

.bar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 28px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
}

.sbox {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 1 300px;
  min-width: 0;
  padding: 0 14px;
  border-radius: 12px;
  background: var(--soft);
  color: var(--vio);
}

.sbox input { margin: 0; border: 0; background: transparent; padding: 10px 0; min-width: 0; }

.sbox input:focus-visible { outline: 0; }

.sbox { position: relative; }

.sres {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 20;
  width: min(440px, calc(100vw - 32px));
  max-height: min(420px, 70vh);
  overflow-y: auto;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--white);
  color: var(--ink);
  box-shadow: 0 12px 32px rgba(17, 26, 51, .16);
}

.sres h4 {
  margin: 8px 10px 4px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--mute);
}

.sres button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin: 0;
  padding: 8px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font-weight: 400;
  text-align: left;
  box-shadow: none;
  transform: none;
}

.sres button:hover, .sres button.on { background: var(--vio-soft); }

.sres .i { flex: none; color: var(--vio); }

.sres div { min-width: 0; }

.sres b, .sres span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sres b { font-size: 13px; }

.sres span { font-size: 12px; color: var(--mute); }

.sres p { margin: 0; padding: 12px 10px; font-size: 13px; color: var(--mute); }

.spot, .spot td { animation: spot 2.5s ease-out; }

@keyframes spot { from, 50% { background: var(--lilac); } }

.who { display: flex; align-items: center; gap: 10px; }

.ava {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 50%;
  background: var(--vio-solid);
  color: #fff;
  font-size: 13px;
  font-weight: 800;
}

.who .ava { padding: 0; margin: 0; overflow: hidden; background: var(--vio-solid); color: #fff; cursor: pointer; }

.ava img { display: block; width: 100%; height: 100%; object-fit: cover; }

.who b { display: block; font-size: 13px; line-height: 1.3; white-space: nowrap; }

.who div span { font-size: 12px; color: var(--mute); text-transform: capitalize; }

.who button {
  padding: 8px 14px;
  font-size: 12px;
  background: var(--vio-soft);
  color: var(--vio);
}

.who button:hover { background: var(--vio-solid); color: #fff; }

.who .gear { padding: 0; border: 0; }

.navend { display: flex; align-items: center; gap: 8px; }

.gear {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  flex: none;
  padding: 0;
  background: rgba(255,255,255,.2);
  border: 1px solid rgba(255,255,255,.55);
}

/* LANGUAGE */

.langwrap { position: relative; flex: none; }

.langmenu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 60;
  width: 220px;
  max-height: min(380px, 70vh);
  overflow-y: auto;
  padding: 6px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(17, 26, 51, .22);
}

.langmenu[hidden] { display: none; }

.langmenu button {
  display: flex;
  width: 100%;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  font-size: 14px;
  background: none;
  color: var(--ink);
  border-radius: 8px;
  text-align: left;
  transform: none;
}

.langmenu button:hover { background: var(--blue-soft); transform: none; }

.langmenu button.on { background: var(--blue); color: #fff; }

.langmenu span { font-size: 12px; font-weight: 500; opacity: .7; }

/* hide Google Translate's own bar, popups and highlights */
#gt-box, body > .skiptranslate, .goog-te-banner-frame, #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
body { top: 0 !important; }
.goog-text-highlight { background: none !important; box-shadow: none !important; }

/* SETTINGS */

.set { padding: 24px; }

.set h3 { margin: 0 0 16px; padding-right: 36px; font-size: 18px; }

.set h4 { margin: 20px 0 8px; font-size: 14px; }

.set h4:first-of-type { margin-top: 0; }

.set p { margin: 0 0 10px; font-size: 12.5px; color: var(--mute); }

.opts { display: flex; gap: 8px; }

.opt {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}

.opt input { width: auto; margin: 0; flex: none; }

.set select { margin-bottom: 10px; }

.preview {
  padding: 8px 14px;
  font-size: 12px;
  background: var(--vio-soft);
  color: var(--vio);
}

.preview:hover { background: var(--vio-solid); color: #fff; }

.set a.opt { justify-content: center; font-size: 14px; font-weight: 700; color: var(--link); }

/* POPUPS */

.toasts {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 200;
  display: grid;
  gap: 8px;
  width: min(340px, calc(100vw - 32px));
}

.toasts div {
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--white);
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 28px rgba(17,26,51,.3);
  cursor: pointer;
}

.toasts .err { background: #cf2f2f; color: #fff; }

.page { padding: 24px 28px 48px; }

.page > h1 { font-size: 22px; margin: 0 0 16px; }

.card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  min-width: 0;
}

.card h2 { font-size: 16px; margin: 0; }

.card .sub { font-size: 12px; color: var(--mute); margin: 0 0 14px; }

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 18px;
}

.stat {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 16px 18px;
  border-radius: 16px;
  color: var(--ink);
  font-weight: 400;
  text-align: left;
}

.stat span { font-size: 13px; font-weight: 600; color: var(--label); }

.stat b { display: block; font-size: 25px; line-height: 1.25; }

.stat svg { width: 30px; height: 30px; }

.c1, .c1:hover { background: var(--lilac); }
.c2, .c2:hover { background: var(--sky); }
.c3, .c3:hover { background: var(--peach); }
.c4, .c4:hover { background: var(--mint); }

.rowa, .rowb {
  display: grid;
  gap: 18px;
  margin-bottom: 18px;
}

.rowa { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); }

.rowb { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }

/* CHARTS */

.chart { position: relative; height: 230px; margin: 8px 0 26px 30px; }

.tick {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid var(--hair);
}

.tick span {
  position: absolute;
  right: 100%;
  margin-right: 8px;
  top: -9px;
  font-size: 11px;
  color: var(--mute);
}

.cols { position: absolute; inset: 0; display: flex; }

.col {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  border-radius: 6px;
}

.col:hover { background: var(--soft); }

.col i {
  display: block;
  width: min(16px, 60%);
  background: var(--vio);
  border-radius: 4px 4px 0 0;
}

.col em {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 6px;
  font-style: normal;
  font-size: 11px;
  text-align: center;
  color: var(--mute);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.col::after {
  content: attr(data-tip);
  display: none;
  position: absolute;
  bottom: calc(var(--h) + 6px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  padding: 4px 9px;
  border-radius: 7px;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.col:hover::after, .col:focus-visible::after { display: block; }

.donut { display: block; width: 170px; height: 170px; margin: 6px auto 14px; }

.donut circle { fill: none; stroke-width: 13; }

.donut text { text-anchor: middle; fill: var(--ink); }

.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 13px; font-weight: 600; }

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 6px;
}

.feed { list-style: none; margin: 8px 0 0; padding: 0; }

.feed li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--hair);
}

.feed li:last-child { border: 0; }

.feed .fi {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 10px;
  background: var(--sky);
  color: var(--sky-ink);
}

.feed div { min-width: 0; flex: 1; }

.feed b, .feed span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.feed b { font-size: 13px; }

.feed span { font-size: 12px; color: var(--mute); }

/* TAB VIEWS */

.stack { display: grid; gap: 18px; align-content: start; min-width: 0; }

#view.two {
  display: grid;
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}

.tw {
  overflow-x: auto;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
}

.card .tw { border: 0; border-radius: 0; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--hair); white-space: nowrap; }

th { color: var(--mute); font-size: 12px; font-weight: 700; }

tr:last-child td { border-bottom: 0; }

td button { padding: 6px 14px; font-size: 12px; }

#view form { border-radius: 18px; }

#view form button, .banner button, td button { background: var(--vio-solid); }

#view form button:hover, .banner button:hover, td button:hover { background: #6425cb; }

.note {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 12px;
  white-space: pre-wrap;
}

.note.lock { background: var(--lock-bg); color: var(--lock-ink); }

.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

.files button { max-width: 240px; margin: 0; padding: 6px 12px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 18px;
  margin-bottom: 14px;
  border-radius: 14px;
  background: var(--lilac);
  font-weight: 600;
}

.attbar { display: flex; flex-wrap: wrap; gap: 12px; }

.attbar label { flex: 1 1 150px; min-width: 0; }

.attsum { font-size: 13px; font-weight: 700; margin: 0 0 12px; }

/* wall-calendar look: red month band, ruled grid, big dates, red Sundays */
.calwrap { margin-bottom: 14px; border: 2px solid var(--ink); background: var(--white); overflow: hidden; }

.calhead { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 14px; background: var(--red); color: #fff; }

.calhead b { font-size: 26px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }

.calhead span { font-size: 22px; font-weight: 800; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }

.cal > b {
  padding: 6px 0;
  border-bottom: 2px solid var(--ink);
  border-right: 1px solid var(--line);
  font-size: 12px;
  font-weight: 800;
  text-align: center;
  text-transform: uppercase;
  color: var(--ink);
}

.cal > b:first-child { color: var(--red); }

.cal > b:nth-child(7), .cal > :nth-child(7n) { border-right: 0; }

.cal > span:empty { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }

.day {
  position: relative;
  display: block;
  height: 64px;
  padding: 4px 6px;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  border-radius: 0;

  color: var(--ink);

  font-weight: 900;
  line-height: 1;

.day:hover { transform: none; }

.day small { position: absolute; right: 6px; bottom: 4px; font-size: 11px; font-weight: 800; }

.day.p, .day.p:hover { background: var(--mint); color: var(--green); }

.day.a, .day.a:hover { background: var(--rose); color: var(--red); }

.day.off { background: var(--white); color: var(--red); }

.day.later { color: var(--later); }

@media (max-width: 520px) {
  .day { height: 50px; font-size: 18px; }

.bad { color: var(--red); font-weight: 700; }

.ok { color: var(--green); font-weight: 700; }

/* DARK THEME: the parts that are not plain colour swaps */

/* DASHBOARD GREETING */

.tools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-bottom: 14px; }

.regend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.regend button:last-child { background: var(--vio-solid); }

.card th, .card td { padding: 12px 8px; }

@media (max-width: 800px) {

}

@media (prefers-reduced-motion: reduce) {
  .fresh #view, .fresh .hello, .fresh .col i { animation: none; }
}

async function api(p, m = 'GET', b) {
  const r = await fetch('/api/' + p, {
    method: m,
    headers: {
      'Content-Type': 'application/json',
      Authorization: T
    },
    body: b ? JSON.stringify(b) : undefined
  });

  const ct = r.headers.get('content-type') || '';

  if (!ct.includes('application/json')) {
    await r.text();
    throw new Error(
      'API returned a webpage instead of JSON. Start the ONERA backend with node server.js and open http://localhost:3000.'
    );
  }

  const j = await r.json();

  if (r.status === 401 && p !== 'login') {
    out();
    throw 'Session ended. Please login again.';
  }

  if (!r.ok) throw j.error || 'Error';

  return j;
}

/* a modal dialog covers the whole page, so popups must sit inside the open one */
function popup(m, bad) {
  const t = document.createElement('div');

  t.textContent = m;
  if (bad) t.className = 'err';
  t.onclick = () => t.remove();

  ($('dialog[open]') || document.body).append(toasts);
  toasts.append(t);
  setTimeout(() => t.remove(), S.secs * 1000);
}

const fail = e => popup(e.message || e, true);

function setLang(c) {
  const gone = 'googtrans=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
  [gone, `${gone}; domain=${location.hostname}`, `${gone}; domain=.${location.hostname}`].forEach(v => { document.cookie = v; });
  if (c !== 'en') document.cookie = `googtrans=/en/${c}; path=/`;
  location.reload();
}

/* a month's days: Sundays and future dates count as neither present nor absent */
function attInfo(m, days) {
  const [y, mo] = m.split('-').map(Number);
  const today = new Date().setHours(0, 0, 0, 0);

  const cells = [...Array(new Date(y, mo, 0).getDate())].map((_, i) => {
    const at = new Date(y, mo - 1, i + 1);
    return { d: i + 1, off: at.getDay() === 0, later: at > today, on: days.includes(i + 1) };
  });

  const open = cells.filter(c => !c.off && !c.later);
  const present = open.filter(c => c.on).length;

  return {
    cells,
    y,
    month: new Date(y, mo - 1, 1).toLocaleString('en-IN', { month: 'long' }),
    lead: new Date(y, mo - 1, 1).getDay(),
    working: open.length,
    present,
    absent: open.length - present
  };
}

/* below 75% is shown in red */
const attTag = i => {
  if (!i.working) return '-';
  const p = Math.round(i.present / i.working * 100);
  return `<span class="${p < 75 ? 'bad' : 'ok'}">${p}%</span>`;
};

function attCal(i, edit) {
  const days = i.cells.map(c => {
    const s = c.off ? 'off' : c.later ? 'later' : c.on ? 'p' : 'a';
    const word = { off: 'Sun', later: '', p: 'P', a: 'A' }[s];
    const inner = `${c.d}<small>${word}&nbsp;</small>`;

    return edit && !c.off && !c.later
      ? `<button class="day ${s}" data-d="${c.d}" aria-pressed="${c.on}" onclick="markDay(this)">${inner}</button>`
      : `<span class="day ${s}">${inner}</span>`;
  });

  return `<div class="calwrap">
    <div class="calhead"><b>${i.month}</b><span>${i.y}</span></div>
    <div class="cal">
      ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(x => `<b>${x}</b>`).join('')}
      ${'<span></span>'.repeat(i.lead)}${days.join('')}
    </div>
  </div>`;
}

/* CHARTS */

const niceMax = m => {
  if (m <= 2) return 2;
  if (m < 20) return Math.ceil(m / 2) * 2;
  const step = 10 ** Math.floor(Math.log10(m));
  return Math.ceil(m / step * 2) / 2 * step;
};

function bars(items, unit = '', top) {
  if (!items.length || !items.some(x => x.v)) {
    return '<p class="empty">No data yet.</p>';
  }

  const max = top || niceMax(Math.max(...items.map(x => x.v)));

  return `
    <div class="chart" role="img" aria-label="${esc(items.map(x => `${x.l}: ${x.v}${unit}`).join(', '))}">
      ${[1, .5, 0].map(f =>
        `<div class="tick" style="top:${(1 - f) * 100}%"><span>${max * f}${unit}</span></div>`
      ).join('')}
      <div class="cols">
        ${items.map(x => {
          const h = x.v / max * 100;
          return `<div class="col" tabindex="0" style="--h:${h}%" data-tip="${esc(x.l)}: ${x.v}${unit}">
            <i style="height:${h}%"></i><em>${esc(x.l)}</em>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function donut(parts, label) {
  const total = parts.reduce((s, p) => s + p.v, 0);

  if (!total) return '<p class="empty">No data yet.</p>';

  const shown = parts.filter(p => p.v);
  const gap = shown.length > 1 ? 1.5 : 0;
  let at = 0;

  const arcs = shown.map(p => {
    const len = p.v / total * 100;
    const arc = `<circle cx="60" cy="60" r="50" pathLength="100" stroke="${p.c}"
      stroke-dasharray="${Math.max(len - gap, .5)} 100" stroke-dashoffset="${-at}"
      transform="rotate(-90 60 60)"><title>${esc(p.l)}: ${p.v}</title></circle>`;
    at += len;
    return arc;
  }).join('');

  return `
    <svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${esc(parts.map(p => `${p.l}: ${p.v}`).join(', '))}">
      ${arcs}
      <text x="60" y="56" font-size="9">${esc(label)}</text>
      <text x="60" y="72" font-size="17" font-weight="800">${total}</text>
    </svg>
    <div class="legend">
      ${parts.map(p => `<span><i style="background:${p.c}"></i>${esc(p.l)}: ${p.v}</span>`).join('')}
    </div>`;
}

/* a student's marks added up across all exams */
function totalMarks(id) {

/* a student has one class, a teacher can have many */
const classesOf = x => x.cls || (x.classes || []).join(', ');

/* a leading = + - or @ would run as a formula when the file opens in Excel */
function csv(name, head, rows) {
  const cell = v => `"${String(v ?? '').replace(/^[=+\-@]/, "'$&").replace(/"/g, '""')}"`;
  const a = document.createElement('a');

  a.href = URL.createObjectURL(new Blob(
    ['﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n')],
    { type: 'text/csv;charset=utf-8' }
  ));
  a.download = name + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

  async Fees() {
    const f = await api('fees');
    const st = U.role === 'student';
    const now = new Date().setHours(0, 0, 0, 0);
    const all = st ? [] : (await api('users')).filter(x => x.role === 'student');
    const kids = all.filter(x => x.cls !== 'Passed out');
    const pendingOf = fee => kids.filter(x => !fee.paidBy.includes(x.id));
    const open = f.find(x => x.id === feeOpen);
    const unpaid = open ? pendingOf(open) : [];
    /* a passed out student who paid still counts as paid */
    const paid = open ? all.filter(x => open.paidBy.includes(x.id)) : [];

    const list = tbl(
      st
        ? ['Payment', 'Amount', 'Last date', 'Status', '']
        : ['Payment', 'Amount', 'Last date', 'Paid by', 'Pending', ''],
      f.map(x =>
        st
          ? [
              esc(x.title),
              '₹' + x.amount,
              date(x.dueDate),
              x.paid
                ? '<span class="ok">Paid</span>'
                : (
                    new Date(x.dueDate) < now
                      ? '<span class="bad">Overdue</span>'
                      : 'Due'
                  ),
              x.paid
                ? `<button type="button" onclick="receipt('${x.id}')">Receipt (PDF)</button>`
                : `<button onclick="pay('${x.id}')">Pay Now</button>`
            ]
          : [
              esc(x.title),
              '₹' + x.amount,
              date(x.dueDate),
              x.paidCount + (x.paidCount === 1 ? ' student' : ' students'),
              pendingOf(x).length,
              `<button type="button" onclick="feeOpen=feeOpen==='${x.id}'?'':'${x.id}';go()">${x.id === feeOpen ? 'Hide' : 'View students'}</button>
              ${rmBtn('fees', x.id)}`
            ]
      )
    );

    if (st) return list;

    return form('fees', 'Add Student Fee', [
      inp('title', 'Title (e.g. Term 2 fee)'),
      inp('amount', 'Amount (₹)', 'number'),
      inp('dueDate', 'Last date', 'date')
    ], 'Add Fee') + `<div class="stack">
      ${list}
      ${open
        ? card(esc(open.title), `${paid.length} paid, ${unpaid.length} pending · ${money(open.amount)} each`,
            tbl(['Student', UNIT(), 'Status', 'Paid on'], [
              ...unpaid.map(x => [esc(x.name), esc(x.cls), '<span class="bad">Pending</span>', '-']),
              ...paid.map(x => [esc(x.name), esc(x.cls), '<span class="ok">Paid</span>', date(open.paidAt[x.id])])
            ]))
        : ''}
    </div>`;
  }
};

const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

function hello() {
  const h = new Date().getHours();
  const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening';
  const t = TABS[U.role];

  return `<div class="hello">
    <div>
      <small>${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</small>
      <h1>Good ${part}, ${esc(String(U.name).replace(' (Admin)', ''))}</h1>
      <p>${U.role === 'school' ? (U.college ? 'College' : 'School') + ' admin' : esc(U.school || 'ONERA')}${U.cls ? ` · ${UNIT()} ${esc(U.cls)}` : ''}${U.role === 'teacher' && myCL().length ? ` · ${U.college ? 'Semesters' : 'Classes'} ${U.classes.join(', ')}` : ''}</p>
    </div>
    <div class="quick">
      ${t.slice(1, 4).map(x => `<button type="button" onclick="tab=${t.indexOf(x)};go()">${ic(TAB_ICON[x])} ${x}</button>`).join('')}
    </div>
  </div>`;
}

async function dash() {
  if (U.role === 'teacher') await refreshMe(); /* the school can change their classes at any time */

  const t = TABS[U.role] || [];
  const n = t[tab] || t[0];
  if (n !== 'Profile') profileFor = '';
  const body = await V[n]();
  const fresh = lastPage !== n;

  lastPage = n;

  return `
    <div class="shell">

/* cropped to a small square, because the login is kept in localStorage with the photo in it */
async function squarePhoto(file) {
  const img = await createImageBitmap(file).catch(() => {
    throw 'Could not read the image.';
  });

  const side = Math.min(img.width, img.height);
  const c = document.createElement('canvas');
  c.width = c.height = 256;

  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, 256, 256);
  g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 256, 256);

  return c.toDataURL('image/jpeg', 0.85);
}

async function findAll(v) {
  const box = $('#findres');
  const words = v.toLowerCase().split(/\s+/).filter(Boolean);

  if (!words.length) {
    box.hidden = true;
    return;
  }

  try {
    /* reused until the next render, so typing does not refetch document photos */
    if (!findData) {
      findData = loadFind();
      findData.catch(() => findData = null);
    }

    const all = await findData;

    /* a newer letter was typed while this one waited */
    if (!box.isConnected || $('#findq').value !== v) return;

    findHits = all.filter(x => words.every(w => x.text.includes(w))).slice(0, 50);

    box.innerHTML = findHits.length
      ? findHits.map((x, i) =>
          `${!i || findHits[i - 1].g !== x.g ? `<h4>${x.g}</h4>` : ''}
          <button type="button" class="${i ? '' : 'on'}" onclick="findPick(${i})">
            ${ic(x.i)}<div><b>${esc(x.t)}</b><span>${esc(x.s)}</span></div>
          </button>`
        ).join('')
      : `<p>Nothing found for "${esc(v.trim())}".</p>`;

    box.hidden = false;
    box.scrollTop = 0;
  } catch (e) {
    fail(e);
  }
}

async function findPick(i) {
  const x = findHits[i];

  if (!x) return;

  closeFind();
  if (x.run) x.run();
  if (!x.n) return;

  tab = TABS[U.role].indexOf(x.n);
  await go();

  if (!x.hit) return;

  const row = [...document.querySelectorAll('#view tr, #view .note, #view .notice, #view .feed li')]
    .find(r => !r.querySelector('th') && x.hit.every(h => r.textContent.includes(h)));

  if (row) {
    row.classList.add('spot');
    row.scrollIntoView({ block: 'center' });
  }
}

function findKey(e) {
  const list = [...document.querySelectorAll('#findres button')];
  const at = list.findIndex(b => b.classList.contains('on'));

  if (e.key === 'Escape') {
    closeFind();
  } else if (e.key === 'Enter') {
    findPick(at);
  } else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && list.length) {
    e.preventDefault();

    const next = (at + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;

    list[at].classList.remove('on');
    list[next].classList.add('on');
    list[next].scrollIntoView({ block: 'nearest' });
  }
}

/* CLASS CHAT: there is no live connection, so the open room asks for new messages every few seconds */

const CHAT_POLL_MS = 4000;

const chatWhen = d => new Date(d).toDateString() === new Date().toDateString() ? time(d) : `${date(d)}, ${time(d)}`;

/* the server checks again: staff only ever see rooms of their own classes */
const chatMsg = x => {
  const me = x.userId === U.id;
  const tag = { school: 'Admin', teacher: 'Teacher' }[x.role];

  return `<div class="msg ${me ? 'me' : ''} ${tag ? 'staff' : ''}" data-id="${esc(x.id)}">
    <small><b>${esc(me ? 'You' : x.by)}</b>${tag ? ` <span class="role">${tag}</span>` : ''} · ${esc(chatWhen(x.at))}</small>
    <p>${esc(x.body)}</p>
    ${me || U.role !== 'student' ? `<button class="rm" type="button" onclick="chatRemove('${esc(x.id)}')">Delete</button>` : ''}
  </div>`;
};

function chatAdd(log, list) {
  const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 60;

  list.forEach(x => {
    chatSeq = Math.max(chatSeq, x.seq);
    const old = log.querySelector(`[data-id="${x.id}"]`);
    if (x.gone) return old && old.remove();
    if (!old) log.insertAdjacentHTML('beforeend', chatMsg(x));
  });

  if (log.querySelector('.msg')) log.querySelector('.empty')?.remove();
  if (atEnd || list.some(x => x.userId === U.id && !x.gone)) log.scrollTop = log.scrollHeight;
}

function chatStart() {
  clearInterval(chatTimer);
  const log = $('#chatlog');
  if (!log) return;
  log.scrollTop = log.scrollHeight;
  chatTimer = setInterval(chatPoll, CHAT_POLL_MS);
}

async function chatPoll(force) {
  const log = $('#chatlog');
  if (!log || !U) return clearInterval(chatTimer);
  if ((document.hidden && !force) || chatBusy) return;

  chatBusy = 1;
  try {
    const r = await api(`chat?cls=${encodeURIComponent(log.dataset.cls)}&after=${chatSeq}`);
    if ($('#chatlog') === log) chatAdd(log, r); /* the room may have changed while waiting */
  } catch (e) {
    /* a missed check is fine, the next one catches up */
  } finally {
    chatBusy = 0;
  }
}

async function chatSend(f) {
  const btn = f.querySelector('button');
  const data = Object.fromEntries(new FormData(f));

  if (!data.body.trim()) return;
  btn.disabled = true;
  try {
    await api('chat', 'POST', data);
    f.elements.body.value = '';
    while (chatBusy) await new Promise(r => setTimeout(r, 100));
    await chatPoll(true);
  } catch (e) {
    fail(e);
  } finally {
    btn.disabled = false;
    f.elements.body.focus();
  }
}

async function chatRemove(id) {
  if (!confirm('Delete this message for everyone?')) return;

  try {
    await api('chat-remove', 'POST', { id });
    await chatPoll(true);
    done('Message deleted.');
  } catch (e) {
    fail(e);
  }
}

/* camera and big laptop photos are shrunk to a JPEG that fits the 3 MB limit */
async function shrinkPhoto(src) {
  const bmp = await createImageBitmap(src);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k);
  c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
  return new File([blob], (src.name || 'document').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}

    [...f.elements.photo.files].forEach(x => dt.items.add(x));
    dt.items.add(await shrinkPhoto(new File([src], `camera-${Date.now()}.jpg`, { type: src.type })));
    f.elements.photo.files = dt.files;
    showDocPhoto(f.elements.photo);
  } catch (e) {

  }
}

/* every document now in the table, in one ZIP file */
async function saveAllDocs(btn, type = '') {
  const list = shownDocs(type);
  if (!list.length) return fail('No documents to save.');
  const label = btn.textContent;
  btn.disabled = true;

  try {
    const zip = new (await loadZip())();
    const used = new Set();
    for (const [i, x] of list.entries()) {
      btn.textContent = `Saving ${i + 1} of ${list.length}…`;
      const { photoData } = await api('doc-photo?id=' + x.id);
      let name = docFileName(x);
      for (let k = 2; used.has(name); k++) name = `${docFileName(x)}_${k}`;
      used.add(name);
      zip.file(`${fileSafe(x.school)}/${name}.${extOf(photoData)}`, photoData.split(',')[1], { base64: true });
    }
    const one = new Set(list.map(x => x.school)).size === 1 ? fileSafe(list[0].school) : 'All_Schools';
    saveBlob(await zip.generateAsync({ type: 'blob' }), `ONERA_Documents_${one}_${new Date().toLocaleDateString('en-CA')}.zip`);
    done(`${list.length} ${list.length === 1 ? 'document' : 'documents'} saved.`);
  } catch (e) {
    fail(e);
  }
  btn.textContent = label;
  btn.disabled = false;
}

async function openCamera(f) {
  /* no live camera (old browser, or the site is not on https) → let the phone's camera app take it */
  if (!navigator.mediaDevices?.getUserMedia) return f.querySelector('[capture]').click();

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 } } });
  } catch (e) {
    return fail(e.name === 'NotAllowedError'
      ? 'Camera permission was blocked. Allow the camera for this site and try again.'
      : 'No camera found on this device.');
  }

  const box = document.createElement('div');
  box.className = 'cam-view';
  box.innerHTML = `<video autoplay playsinline muted></video>
    <div><button type="button" data-a="snap">📷 Capture</button>
    <button type="button" class="rm" data-a="close">Cancel</button></div>`;
  const video = box.querySelector('video');
  video.srcObject = stream;

  const close = () => {
    stream.getTracks().forEach(t => t.stop());
    box.remove();
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => e.key === 'Escape' && close();

  box.onclick = async e => {
    const a = e.target.dataset.a;
    if (a === 'close') close();
    if (a === 'snap' && video.videoWidth) {
      const c = document.createElement('canvas');
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      c.getContext('2d').drawImage(video, 0, 0);
      close();
      setDocPhoto(f, await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.9)));
    }
  };
  document.addEventListener('keydown', onKey);
  document.body.append(box);
}

/* FEE RECEIPT (PDF) */

let jsPdfLoad;
const loadJsPdf = () =>
  jsPdfLoad ||= new Promise((ok, no) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = () => ok(window.jspdf.jsPDF);
    s.onerror = () => { jsPdfLoad = null; no(new Error('Could not load the PDF maker. Check your internet and try again.')); };
    document.head.append(s);
  });

async function receipt(id) {
  try {
    const [jsPDF, f] = await Promise.all([loadJsPdf(), api('fees')]);
    const x = f.find(y => y.id === id);
    if (!x || !x.paid) throw new Error('This fee is not paid yet.');

    /* the built-in PDF fonts have no ₹ sign, so the PDF writes Rs. */
    const rs = n => 'Rs. ' + Number(n || 0).toLocaleString('en-IN');
    const at = new Date(+x.paidAt);
    const no = 'RCPT-' + String(x.id).slice(-6).toUpperCase() + '-' + String(+x.paidAt).slice(-6);
    const doc = new jsPDF({ unit: 'mm', format: 'a5' });
    const W = doc.internal.pageSize.getWidth();

    doc.setFont('helvetica', 'bold').setFontSize(16).text(U.school || 'School', W / 2, 18, { align: 'center' });
    doc.setFont('helvetica', 'normal').setFontSize(11).text('Fee Payment Receipt', W / 2, 25, { align: 'center' });
    doc.setLineWidth(0.4).line(12, 30, W - 12, 30);

    const rows = [
      ['Receipt No.', no],
      ['Date', at.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })],
      ['Time', at.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })],
      ['Student', U.name],
      ['Username', U.username],
      [UNIT(), String(U.cls ?? '-')],
      ['Fee', x.title],
      ['Last date', date(x.dueDate)],
      ['Status', 'PAID']
    ];
    doc.setFontSize(10);
    rows.forEach(([k, v], i) => {
      const y = 40 + i * 8;
      doc.setFont('helvetica', 'normal').text(k, 14, y);
      doc.setFont('helvetica', 'bold').text(String(v), 50, y, { maxWidth: W - 64 });
    });

    const y = 40 + rows.length * 8 + 2;
    doc.setLineWidth(0.4).line(12, y, W - 12, y);
    doc.setFontSize(13).text('Amount Paid', 14, y + 9);
    doc.text(rs(x.amount), W - 14, y + 9, { align: 'right' });
    doc.line(12, y + 14, W - 12, y + 14);

    doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(120)
      .text('This is a computer generated receipt and does not need a signature.', W / 2, y + 24, { align: 'center' });

    doc.save(`Fee-Receipt-${x.title.replace(/[^\w-]+/g, '_')}.pdf`);
  } catch (e) {
    fail(e);
  }
}

/* DELETE */

async function removeItem(kind, id) {
  const paid = kind === 'fees' ? ' Its payment records go with it.' : '';

  if (!confirm(`Delete this?${paid} This cannot be undone.`)) return;

  try {
    await api('remove', 'POST', { kind, id });
    await go();
    done('Deleted.');
  } catch (e) {
    fail(e);
  }
}

async function removePerson(id) {
  const x = peopleAll.find(v => v.id === id);
  const left = x.role === 'student'
    ? 'Their results, attendance, documents and fee payments go with them.'
    : 'Their notes and notices stay.';

  if (!confirm(`Delete ${x.name} (${x.role})? ${left} This cannot be undone.`)) return;

  try {
    await api('remove-user', 'POST', { id });
    await go();
    done('Deleted.');
  } catch (e) {
    fail(e);
  }
}

/* REPORT CARD AND CSV */

function printReport(id) {
  const me = U.role === 'student' ? U : resultsFor.find(x => x.id === id);
  const exams = {};

  resultsAll.filter(x => x.studentId === id).forEach(x => (exams[x.exam] = exams[x.exam] || []).push(x));

  $('#printarea').innerHTML = `
    <h1>${esc(U.school || 'ONERA')}</h1>
    <p><b>Report card</b> · ${date(Date.now())}</p>
    <p>${esc(me.name)} · ${UNIT()} ${esc(me.cls)}</p>
    ${Object.entries(exams).map(([e, r]) => {
      const got = r.reduce((s, x) => s + x.marks, 0), all = r.reduce((s, x) => s + x.total, 0);

      return `<h2>${esc(e)}</h2>
        <table>
          <tr><th>Subject</th><th>Marks</th><th>%</th></tr>
          ${r.map(x => `<tr><td>${esc(x.subject)}</td><td>${x.marks}/${x.total}</td><td>${pct(x)}%</td></tr>`).join('')}
          <tr><th>Total</th><th>${got}/${all}</th><th>${pct({ marks: got, total: all })}%</th></tr>
        </table>`;
    }).join('')}`;

  window.print();
}

const exportResults = () =>
  csv('results', ['Student', 'Exam', 'Subject', 'Marks', 'Total', '%'],
    resultsAll.map(x => [x.student, x.exam, x.subject, x.marks, x.total, pct(x)]));

/* CLASS REGISTER */

function regCount() {
  const all = document.querySelectorAll('#reg input');

  $('#regsum').textContent = `${[...all].filter(x => x.checked).length} of ${all.length} present`;
}

function regAll(on) {
  document.querySelectorAll('#reg input').forEach(x => x.checked = on);
  regCount();
}

async function regSave() {
  try {
    await api('attendance-day', 'POST', {
      cls: attCls,
      date: attDate,
      present: [...document.querySelectorAll('#reg input:checked')].map(x => x.value)
    });
    await go();
    done('Register saved.');

/* ATTENDANCE: each click saves one date */

async function markDay(b) {
  const flip = () => {
    b.classList.toggle('p');
    b.classList.toggle('a');
  };
  const present = b.classList.contains('a');

  flip();
  attSaving++;

  try {
    await api('attendance', 'POST', {
      studentId: attStudent,
      month: attMonth,
      day: +b.dataset.d,
      present
    });
  } catch (e) {
    flip();
    fail(e);
  }

  if (!--attSaving) go();
}

/* FORM SUBMISSION */

const readFile = file =>
  new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject('Could not read the file.');

    reader.readAsDataURL(file);
  });

const SAVED = {
  schools: 'School added.',
  users: 'Person added.',
  'teacher-classes': 'Classes saved.',
  notes: 'Notes uploaded.',
  notices: 'Notice posted.',
  timetable: 'Period added.',
  homework: 'Homework given.',
  results: 'Result saved.',
  docs: 'Document uploaded.',
  fees: 'Fee added.',
  photo: 'Photo saved.',
  profile: 'Profile saved.'
};

document.addEventListener('submit', async e => {
  e.preventDefault();

  const f = e.target;
  const p = f.dataset.p;

  /* sending a message only adds it to the room, it does not redraw the page */
  if (p === 'chat') return chatSend(f);

  try {
    const data = Object.fromEntries(new FormData(f));

    if (p === 'users' || p === 'teacher-classes') {
      data.classes = new FormData(f).getAll('classes');
    }

    if (p === 'docs') {
      const files = [...f.elements.photo.files];

      if (!files.length) {
        throw 'Upload a photo from the laptop or take one with the camera.';
      }

      if (files.length > MAX_DOCS) {
        throw `Choose up to ${MAX_DOCS} photos at once.`;
      }

      if (files.some(x => !['image/jpeg', 'image/png', 'image/webp'].includes(x.type))) {
        throw 'Choose JPG, PNG or WebP images.';
      }

      /* each photo is its own document; all but the last go up here, the last one below */
      delete data.photo;
      const btn = f.querySelector('button:not([type])');
      let sent = 0;
      btn.disabled = true;
      try {
        for (const [i, x] of files.entries()) {
          btn.textContent = `Uploading ${i + 1} of ${files.length}…`;
          const photoData = await readFile(x.size > 3 * 1024 * 1024 ? await shrinkPhoto(x) : x);
          if (i < files.length - 1) { await api('docs', 'POST', { ...data, photoData }); sent++; }
          else data.photoData = photoData;
        }
        await api('docs', 'POST', data);
        sent++;
      } catch (x) {
        btn.disabled = false;
        btn.textContent = 'Upload';
        if (sent) await go(); // the ones already sent show in the table
        throw `${sent ? `${sent} of ${files.length} uploaded. ` : ''}${x.message || x}`;
      }
      await go();
      return done(`${sent} ${sent === 1 ? 'document' : 'documents'} uploaded.`);
    }

    if (p === 'notes') {
      const files = [...f.elements.files.files];

      if (!data.content.trim() && !files.length) {
        throw 'Write some notes or attach a file.';
      }

      if (files.length > 20) {
        throw 'Attach up to 20 files.';
      }

      if (files.some(x => !['application/pdf', 'image/jpeg', 'image/png', 'image/webp'].includes(x.type))) {
        throw 'Choose PDF, JPG, PNG or WebP files.';
      }

      if (files.reduce((s, x) => s + x.size, 0) > 10 * 1024 * 1024) {
        throw 'Files must be 10 MB or smaller in total.';
      }

      data.files = await Promise.all(
        files.map(async x => ({ name: x.name, data: await readFile(x) }))
      );
    }

    if (p === 'photo') {
      const file = f.elements.photo.files[0];

      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        throw 'Choose a JPG, PNG or WebP image.';
      }

      data.photoData = await squarePhoto(file);
      delete data.photo;
    }

    const r = await api(p, 'POST', data);

    if (p === 'login') {
      T = r.token;
      U = r.user;

      localStorage.t = T;
      localStorage.u = JSON.stringify(U);

      tab = Math.max((TABS[U.role] || []).indexOf(afterLogin), 0);
      afterLogin = '';
    }

    if (p === 'forgot-username') {
      return loginView('usernameCode', data.email);
    }

    if (p === 'forgot-password') {
      return loginView('passwordCode', data.username);
    }

    if (p === 'verify-username') {
      return loginView('usernames', r.usernames);
    }

    if (p === 'reset-password') {
      popup('Password changed. Please login with your new password.');
      return loginView('login');
    }

    if (p === 'password') {
      clearLogin();
      await go();
      return popup('Password changed. Please login with your new password.');
    }

    if (p === 'photo' || (p === 'profile' && !data.id)) {
      U = r;
      localStorage.u = JSON.stringify(U);
    }

    if (p === 'teacher-classes') assignFor = '';

    await go();

    if (SAVED[p]) done(SAVED[p]);

  } catch (x) {
    fail(x);
  }
});

/* the login saved in this browser can be out of date, the server has the real email */
async function refreshMe() {
  if (!T) return;

  U = await api('me');
  localStorage.u = JSON.stringify(U);
}

/* START WEBSITE */

/* /school-login?to=Documents asks for a page to open once, after its login */
try {
  if (sessionStorage.open && U) tab = Math.max((TABS[U.role] || []).indexOf(sessionStorage.open), 0);
  sessionStorage.removeItem('open');
} catch (e) {}

refreshMe().catch(fail).then(go);
